name: Build and publish debian package for ROS package
on:
  workflow_call:
    inputs:
      platform:
        type: string
        description: 'Platform to build for (e.g. linux/amd64 or linux/arm64)'
        required: true
      ubuntu-distro:
        type: string
        description: 'Ubuntu distribution to build for (e.g. focal)'
        required: true
      ros2-distro:
        type: string
        description: 'ROS distribution to build for (e.g. humble)'
        required: true
      source-prefix:
        type: string
        description: 'Prefix of the source directory for the package(s)'
        default: '.'
      packages:
        type: string
        description: 'Comma-separated list of package subdirectories to build in dependency order (e.g. "msgs,core"). If empty, builds the single package at source-prefix root.'
        default: ''
      runner:
        description: "Workflow runner (e.g. 8cpu-linux-x64)"
        required: false
        type: string
        default: ${{ vars.RUNSON_CI_BUILDER_DEFAULT_X64 }}
      public:
        description: "Push to 'public' repo on cloudsmith (if false, push to 'apps')"
        required: false
        type: boolean
        default: true
      workflow-ref:
        description: "Git ref of ros-debian-workflow to use (must match the ref in 'uses:')"
        required: false
        type: string
        default: 'main'

jobs:
  build-and-publish:
    runs-on: [runs-on,"runner=${{ inputs.runner }}","run-id=${{ github.run_id }}"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTERION_CI_ACCESS_TOKEN == '' && github.token || secrets.AUTERION_CI_ACCESS_TOKEN }}
          submodules: recursive
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set version in package.xml, if building release
        if: ${{ github.event_name == 'release' }}
        run: |
          SANTIZED_VERSION=$(echo ${{ github.event.release.tag_name }} | sed 's/-/\~/g')
          if [ -n "${{ inputs.packages }}" ]; then
            IFS=',' read -ra PKGS <<< "${{ inputs.packages }}"
            for pkg in "${PKGS[@]}"; do
              pkg=$(echo "$pkg" | xargs)
              sed -i "s/<version>.*<\/version>/<version>$SANTIZED_VERSION<\/version>/" "${{ inputs.source-prefix }}/$pkg/package.xml"
            done
          else
            sed -i "s/<version>.*<\/version>/<version>$SANTIZED_VERSION<\/version>/" ${{ inputs.source-prefix }}/package.xml
          fi
      
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          repository: auterion/ros-debian-workflow
          ref: ${{ inputs.workflow-ref }}
          path: ros-debian-workflow

      - name: Build build environment
        working-directory: ros-debian-workflow
        run: |
          docker build . -f Dockerfile.debian-buildenv \
            --platform ${{ inputs.platform }} \
            --build-arg="ROS2_DISTRO=${{ inputs.ros2-distro }}" \
            --build-arg="UBUNTU_DISTRO=${{ inputs.ubuntu-distro }}" \
            -t buildenv:current

      - name: Build debian package
        run: |
          docker run --rm -v $(pwd)/${{ inputs.source-prefix }}:/work --platform ${{ inputs.platform }} buildenv:current \
            /ros_entrypoint.sh /scripts/build_package.sh "${{ inputs.packages }}"

      - name: Generate artifact name
        run: |
          # remove forward slashes from platform name
          platform_name="${{ inputs.platform }}"
          platform_name="${platform_name//\//-}"
          echo "ARTIFACT_NAME=debian-packages_${platform_name}_${{ inputs.ubuntu-distro }}_${{ inputs.ros2-distro }}" >> $GITHUB_ENV

      - name: Upload artifacts to github actions/checkout
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ inputs.source-prefix }}/output/*.deb
      
      - name: List built packages
        run: |
          echo "Built packages:"
          ls -la ${{ inputs.source-prefix }}/output/*.deb

      - name: Push single package to cloudsmith
        if: ${{ github.event_name == 'release' && inputs.packages == '' }}
        uses: cloudsmith-io/action@v0.5.4
        with:
          api-key: ${{ secrets.AUTERION_CI_CLOUDSMITH_API_KEY }}
          command: 'push'
          format: 'deb'
          owner: auterion
          repo: ${{ inputs.public && 'public' || 'apps' }}
          distro: ubuntu
          release: ${{ inputs.ubuntu-distro }}
          file: ${{ inputs.source-prefix }}/output/*.deb

      - name: Push multiple packages to cloudsmith
        if: ${{ github.event_name == 'release' && inputs.packages != '' }}
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.AUTERION_CI_CLOUDSMITH_API_KEY }}
        run: |
          pip install --upgrade cloudsmith-cli
          REPO="${{ inputs.public && 'public' || 'apps' }}"
          for deb in ${{ inputs.source-prefix }}/output/*.deb; do
            [ -f "$deb" ] || continue
            echo "Pushing $(basename $deb) to auterion/$REPO..."
            cloudsmith push deb "auterion/$REPO/ubuntu/${{ inputs.ubuntu-distro }}" "$deb"
          done

